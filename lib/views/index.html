{% extends "base.html" %}

{% block body_id %}home{% endblock %}

{% block hero %}
<section id="hero" style="padding: 40px 0;">
  <div class="row">
    <div class="small-12 columns text-center">
      <img src="{{ '/img/trinket-logo-white.png' | cachePrefix }}" alt="Trinket" style="max-width: 240px;" />
      <p style="color: white; font-size: 1.2rem; margin: 15px 0 0;">Code in Your Browser</p>
    </div>
  </div>
</section>
{% endblock %}

{% block content %}
<div class="row" style="padding: 40px 0;">
  <div class="small-12 columns text-center">
    <p class="lead" style="margin-bottom: 0.5rem;">
      Trinket is an open source browser-based coding platform.
    </p>
    <p style="color: #666; margin-bottom: 0;">
      Write and run Python, HTML, Java, and more.
    </p>
  </div>
</div>
{% endblock %}
