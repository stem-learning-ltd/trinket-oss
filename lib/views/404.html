<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Page not found</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;1,400;1,700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        html { padding: 40px 0; }
        body { text-align: center; font-family: "Roboto", "Helvetica Neue", Arial, sans-serif; }
        h1, h2, h3 { font-family: "Roboto Condensed", "Roboto", "Helvetica Neue", Arial, sans-serif; font-weight: 700; line-height: 1.4; margin: 0; }
        h1 { font-size: 2.75rem; }
        .subheader {
          line-height: 1.6;
          color: #6f6f6f;
          font-weight: 300;
          margin-top: 0.2rem;
          margin-bottom: 0.5rem;
        }
        a {
          color: #DC0745;
          text-decoration: none;
        }
        a:hover { color: #0665b5; }
        hr {
          border: solid #ddd;
          border-width: 1px 0 0;
          clear: both;
          margin: 1.25rem 0 1.1875rem;
          height: 0;
        }
        .nav-link {
          display: inline-block;
          margin-top: 2rem;
          padding: 0.75rem 1.5rem;
          background: #DC0745;
          color: white;
          border-radius: 4px;
          font-weight: 700;
        }
        .nav-link:hover {
          background: #0665b5;
          color: white;
        }
    </style>
</head>
<body>
  <h1>Page not found</h1>
  <hr>
  <p class="subheader">The page you're looking for doesn't exist or may have been moved.</p>
  {% if config.app.supportEmail %}
  <p class="subheader">If you believe this is an error, please contact <a href="mailto:{{ config.app.supportEmail }}">{{ config.app.supportEmail }}</a>.</p>
  {% endif %}
  <a href="/" class="nav-link">Go to Homepage</a>
</body>
</html>
